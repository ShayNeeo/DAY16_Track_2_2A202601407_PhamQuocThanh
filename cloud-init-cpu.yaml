#cloud-config
package_update: true
packages:
  - python3
  - python3-pip
  - libgomp1
  - git
  - htop
runcmd:
  - pip3 install --upgrade pip
  - pip3 install lightgbm scikit-learn pandas numpy kaggle tabulate
  - mkdir -p /home/ubuntu/ml-benchmark
  - chown -R ubuntu:ubuntu /home/ubuntu/ml-benchmark
